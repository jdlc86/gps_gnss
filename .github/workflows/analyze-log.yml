name: Analyze GNSS log
on:
  push:
    branches: [analysis/first-static-log]
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze
        run: python analysis/full_log_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: first-static-analysis
          path: analysis_report.json
