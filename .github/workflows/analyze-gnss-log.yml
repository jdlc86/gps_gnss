name: Analyze GNSS Log

on:
  push:
    branches: [ main ]
    paths:
      - 'gnss_log.txt'
      - 'analysis/analyze_gnss_log_full.py'
      - '.github/workflows/analyze-gnss-log.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze log
        run: python analysis/analyze_gnss_log_full.py gnss_log.txt analysis/gnss_analysis.json
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: gnss-static-analysis
          path: |
            analysis/gnss_analysis.json
            analysis/gnss_analysis.md
