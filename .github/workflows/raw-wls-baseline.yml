name: Raw GNSS WLS Baseline

on:
  push:
    branches:
      - analysis/raw-wls-baseline
    paths:
      - 'gnss_log.txt'
      - 'analysis/run_wls_baseline.py'
      - 'analysis/requirements-wls.txt'
      - '.github/workflows/raw-wls-baseline.yml'
  workflow_dispatch:

jobs:
  wls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r analysis/requirements-wls.txt

      - name: Run WLS baseline
        run: python analysis/run_wls_baseline.py gnss_log.txt --out-dir analysis/wls_output

      - name: Upload WLS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-wls-baseline
          path: analysis/wls_output/
          if-no-files-found: warn
